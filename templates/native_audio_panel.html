<!--
  À insérer dans templates/index.html près des commandes d'enregistrement.
  Le script expose window.NativeAudioMonitor.start() et .stop().
-->
<section class="native-audio-panel" id="nativeAudioPanel">
  <div class="native-audio-devices">
    <label>
      Son du PC
      <select id="nativeSpeakerSelect" aria-label="Sortie audio à enregistrer"></select>
    </label>
    <label>
      Microphone
      <select id="nativeMicrophoneSelect" aria-label="Microphone à enregistrer"></select>
    </label>
  </div>

  <div id="nativeAudioMeters" class="native-audio-meters" hidden>
    <div class="vu-row">
      <div class="vu-heading">
        <span id="systemVuName">Son du PC</span>
        <output id="systemVuDb">−60 dB</output>
      </div>
      <div class="vu-track" role="meter" aria-label="Niveau du son du PC" aria-valuemin="-60" aria-valuemax="0">
        <div class="vu-fill" id="systemVuFill"></div>
      </div>
    </div>

    <div class="vu-row">
      <div class="vu-heading">
        <span id="microphoneVuName">Microphone</span>
        <output id="microphoneVuDb">−60 dB</output>
      </div>
      <div class="vu-track" role="meter" aria-label="Niveau du microphone" aria-valuemin="-60" aria-valuemax="0">
        <div class="vu-fill" id="microphoneVuFill"></div>
      </div>
    </div>

    <p class="vu-help" id="nativeAudioHint">
      Parlez dans le microphone et faites jouer un son sur le PC : les deux barres doivent bouger.
    </p>
  </div>
</section>

<style>
  .native-audio-panel {
    display: grid;
    gap: 0.9rem;
    margin-top: 1rem;
  }

  .native-audio-devices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 0.75rem;
  }

  .native-audio-devices label {
    display: grid;
    gap: 0.35rem;
    font-weight: 600;
  }

  .native-audio-devices select {
    min-width: 0;
    padding: 0.55rem 0.65rem;
  }

  .native-audio-meters {
    display: grid;
    gap: 0.8rem;
    padding: 0.9rem;
    border: 1px solid rgba(127, 127, 127, 0.35);
    border-radius: 0.75rem;
  }

  .vu-row {
    display: grid;
    gap: 0.35rem;
  }

  .vu-heading {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-size: 0.92rem;
  }

  .vu-track {
    position: relative;
    height: 0.9rem;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(127, 127, 127, 0.22);
  }

  .vu-fill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #2fb344 0 68%, #f59f00 68% 88%, #e03131 88% 100%);
    transition: width 80ms linear;
  }

  .vu-fill.is-clipping {
    box-shadow: inset 0 0 0 2px #ffffff, 0 0 0 2px #e03131;
  }

  .vu-help {
    margin: 0;
    font-size: 0.86rem;
    opacity: 0.8;
  }
</style>

<script>
(() => {
  const FLOOR_DB = -60;
  const state = {
    recordingId: null,
    levelsUrl: null,
    pollTimer: null,
    polling: false,
  };

  const element = (id) => document.getElementById(id);

  function csrfToken() {
    return (
      window.WHISPER_CSRF_TOKEN ||
      element("csrf-token")?.value ||
      document.querySelector('meta[name="csrf-token"]')?.content ||
      ""
    );
  }

  async function readJson(response) {
    let payload = {};
    try {
      payload = await response.json();
    } catch (_) {
      // Keep the HTTP diagnostic below when the body is not JSON.
    }
    if (!response.ok) {
      throw new Error(payload.detail || `Erreur HTTP ${response.status}`);
    }
    return payload;
  }

  function fillSelect(select, devices, fallbackLabel) {
    select.replaceChildren();
    if (!devices.length) {
      const option = new Option(fallbackLabel, "");
      option.disabled = true;
      option.selected = true;
      select.add(option);
      return;
    }
    for (const device of devices) {
      const suffix = device.default ? " (par défaut)" : "";
      const option = new Option(`${device.name}${suffix}`, device.id);
      option.selected = Boolean(device.default);
      select.add(option);
    }
  }

  async function loadDevices() {
    const response = await fetch("/native/audio/devices", {
      cache: "no-store",
      headers: { Accept: "application/json" },
    });
    const payload = await readJson(response);
    fillSelect(
      element("nativeSpeakerSelect"),
      payload.speakers || [],
      "Aucune sortie audio"
    );
    fillSelect(
      element("nativeMicrophoneSelect"),
      payload.microphones || [],
      "Aucun microphone"
    );
    return payload;
  }

  function meterPercent(db) {
    const bounded = Math.max(FLOOR_DB, Math.min(0, Number(db) || FLOOR_DB));
    return ((bounded - FLOOR_DB) / -FLOOR_DB) * 100;
  }

  function updateMeter(prefix, source) {
    const peakDb = Number(source?.peak_db ?? FLOOR_DB);
    const fill = element(`${prefix}VuFill`);
    const output = element(`${prefix}VuDb`);
    const track = fill.parentElement;
    const width = meterPercent(peakDb);

    fill.style.width = `${width.toFixed(1)}%`;
    fill.classList.toggle("is-clipping", Boolean(source?.clipped));
    output.value = `${peakDb.toFixed(1)} dB`;
    output.textContent = `${peakDb.toFixed(1)} dB`;
    track.setAttribute("aria-valuenow", peakDb.toFixed(1));
  }

  function resetMeters() {
    updateMeter("system", { peak_db: FLOOR_DB, clipped: false });
    updateMeter("microphone", { peak_db: FLOOR_DB, clipped: false });
  }

  function stopPolling() {
    state.polling = false;
    if (state.pollTimer !== null) {
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
  }

  async function pollLevels() {
    if (!state.polling || !state.levelsUrl) return;
    try {
      const response = await fetch(state.levelsUrl, {
        cache: "no-store",
        headers: { Accept: "application/json" },
      });
      const payload = await readJson(response);
      const sources = payload.sources || {};
      updateMeter("system", sources.system);
      updateMeter("microphone", sources.microphone);

      const systemHasSignal = Boolean(sources.system?.signal);
      const micHasSignal = Boolean(sources.microphone?.signal);
      const hint = element("nativeAudioHint");
      if (!micHasSignal && payload.elapsed > 2) {
        hint.textContent = "Aucun signal micro détecté pour le moment : parlez pour vérifier l'entrée sélectionnée.";
      } else if (!systemHasSignal && payload.elapsed > 2) {
        hint.textContent = "Aucun son du PC détecté pour le moment : faites jouer un son pour vérifier la sortie sélectionnée.";
      } else {
        hint.textContent = "Les deux sources sont capturées. Évitez que les barres restent dans le rouge.";
      }
    } catch (error) {
      // A 404 immediately after stop is normal because the session n'est plus active.
      if (state.polling) {
        element("nativeAudioHint").textContent = error.message;
      }
    } finally {
      if (state.polling) {
        state.pollTimer = setTimeout(pollLevels, 100);
      }
    }
  }

  async function start() {
    if (state.recordingId) {
      throw new Error("Un enregistrement est déjà en cours.");
    }

    const form = new FormData();
    const microphoneId = element("nativeMicrophoneSelect").value;
    const speakerId = element("nativeSpeakerSelect").value;
    if (microphoneId) form.append("microphone_id", microphoneId);
    if (speakerId) form.append("speaker_id", speakerId);

    const response = await fetch("/native/recordings/start", {
      method: "POST",
      headers: { "X-Whisper-CSRF": csrfToken() },
      body: form,
    });
    const payload = await readJson(response);

    state.recordingId = payload.recording_id;
    state.levelsUrl = payload.levels_url;
    element("systemVuName").textContent = payload.system_device_name || "Son du PC";
    element("microphoneVuName").textContent = payload.microphone_device_name || "Microphone";
    element("nativeAudioMeters").hidden = false;
    resetMeters();
    state.polling = true;
    void pollLevels();
    return payload;
  }

  async function stop() {
    if (!state.recordingId) {
      throw new Error("Aucun enregistrement n'est en cours.");
    }

    const recordingId = state.recordingId;
    stopPolling();
    const response = await fetch(`/native/recordings/${encodeURIComponent(recordingId)}/stop`, {
      method: "POST",
      headers: { "X-Whisper-CSRF": csrfToken() },
    });

    try {
      return await readJson(response);
    } finally {
      state.recordingId = null;
      state.levelsUrl = null;
    }
  }

  window.NativeAudioMonitor = {
    loadDevices,
    start,
    stop,
    resetMeters,
    get recordingId() {
      return state.recordingId;
    },
  };

  document.addEventListener("DOMContentLoaded", () => {
    resetMeters();
    loadDevices().catch((error) => {
      element("nativeAudioHint").textContent = error.message;
    });
  });
})();
</script>
